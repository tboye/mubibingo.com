<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#121212"/>

  <!-- Bingo Grid (vertically centered, left side) -->
  <g transform="translate(205, 220)">
    <!-- Row 1 -->
    <circle cx="0" cy="0" r="42" fill="#4ade80"/>
    <circle cx="95" cy="0" r="42" fill="#4ade80"/>
    <circle cx="190" cy="0" r="42" fill="#555"/>
    <!-- Row 2 -->
    <circle cx="0" cy="95" r="42" fill="#fbbf24"/>
    <circle cx="95" cy="95" r="42" fill="#4ade80"/>
    <circle cx="190" cy="95" r="42" fill="#4ade80"/>
    <!-- Row 3 -->
    <circle cx="0" cy="190" r="42" fill="#555"/>
    <circle cx="95" cy="190" r="42" fill="#555"/>
    <circle cx="190" cy="190" r="42" fill="#fbbf24"/>
  </g>

  <!-- Title -->
  <text x="520" y="325" font-family="Archivo ExtraCondensed, Archivo, sans-serif" font-size="140" font-weight="800" fill="#aecbf8">MUBI BINGO</text>

  <!-- Tagline -->
  <text x="524" y="385" font-family="Archivo, sans-serif" font-size="30" fill="#9a9a9a">Find where your film is streaming</text>

</svg>